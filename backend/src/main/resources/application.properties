spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.application.name=repair-service
amstar.auth.admin-emails=${AMSTAR_ADMIN_EMAILS:}
amstar.auth.bookkeeper-emails=${AMSTAR_BOOKKEEPER_EMAILS:}
amstar.auth.signup-code=${AMSTAR_SIGNUP_CODE}
amstar.auth.jwt-secret=${AMSTAR_JWT_SECRET}
amstar.cors.allowed-origin=${AMSTAR_CORS_ORIGIN:http://localhost:5173}

# SMTP. Gmail needs an App Password (not the account password) with 2FA on.
spring.mail.host=${AMSTAR_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${AMSTAR_SMTP_PORT:587}
spring.mail.username=${AMSTAR_SMTP_USER}
spring.mail.password=${AMSTAR_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Where the reset link points. Must be the public side, not localhost.
amstar.app-url=${AMSTAR_APP_URL:http://localhost:5173}
amstar.auth.reset-token-minutes=30
# Explicit rather than relied-upon: never echo exception text to a client.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
# Lazy loading must not silently happen in the view layer.
spring.jpa.open-in-view=false

# Jackson 2.16+ disables this by default, but a parse error on /api/auth/login
# would otherwise write the submitted password into the log.
spring.jackson.parser.include-source-in-location=false
