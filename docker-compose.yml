services:
  postgres-db:
    image: postgres:15-alpine
    container_name: amstar_postgres
    environment:
      POSTGRES_DB: amstar_db
      POSTGRES_USER: amstar_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amstar_user -d amstar_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amstar_backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/amstar_db
      SPRING_DATASOURCE_USERNAME: amstar_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      AMSTAR_SIGNUP_CODE: ${AMSTAR_SIGNUP_CODE:?AMSTAR_SIGNUP_CODE must be set (see .env.example)}
      AMSTAR_JWT_SECRET: ${AMSTAR_JWT_SECRET:?AMSTAR_JWT_SECRET must be set (see .env.example)}
      AMSTAR_CORS_ORIGIN: ${AMSTAR_CORS_ORIGIN:-http://localhost:5173}
      AMSTAR_SMTP_HOST: ${AMSTAR_SMTP_HOST:-smtp.gmail.com}
      AMSTAR_SMTP_PORT: ${AMSTAR_SMTP_PORT:-587}
      AMSTAR_SMTP_USER: ${AMSTAR_SMTP_USER:?AMSTAR_SMTP_USER must be set (see .env.example)}
      AMSTAR_SMTP_PASSWORD: ${AMSTAR_SMTP_PASSWORD:?AMSTAR_SMTP_PASSWORD must be set (see .env.example)}
      AMSTAR_APP_URL: ${AMSTAR_APP_URL:-http://localhost:5173}
      AMSTAR_ADMIN_EMAILS: ${AMSTAR_ADMIN_EMAILS:?AMSTAR_ADMIN_EMAILS must be set (see .env.example)}
      AMSTAR_BOOKKEEPER_EMAILS: ${AMSTAR_BOOKKEEPER_EMAILS:-}
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    build:
      context: ./caddy
    container_name: amstar_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
